name: Worker CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'codehive-worker/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'codehive-worker/**'
      - '.github/workflows/worker-ci.yml'

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        working-directory: codehive-worker
        # Exclude the SpringBootTest context-load test — it requires live Docker/RabbitMQ/MinIO.
        # Unit tests (ExecutionResultTest, ContainerSessionTest, LanguageExecutorFactoryTest)
        # run with no external dependencies.
        run: ./gradlew test --tests "com.github.codehive.worker.sandbox.*" --tests "com.github.codehive.worker.sandbox.factory.*" --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-test-results
          path: codehive-worker/build/reports/tests/test/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: codehive-worker/build/test-results/test/*.xml
          check_name: Worker Test Results

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        working-directory: codehive-worker
        run: ./gradlew build -x test

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: codehive-worker-jar
          path: codehive-worker/build/libs/*.jar
          retention-days: 7
