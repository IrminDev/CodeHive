services:
  postgres:
    image: 'postgres:18.1-alpine'
    container_name: 'db'
    environment:
      - 'POSTGRES_DB=${DATABASE_NAME}'
      - 'POSTGRES_PASSWORD=${DATABASE_PASSWORD}'
      - 'POSTGRES_USER=${DATABASE_USERNAME}'
    ports:
      - '5432:5432'
    volumes:
      - 'db_data:/var/lib/postgresql/data'

volumes:
  db_data:
