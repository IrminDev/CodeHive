<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Email notifications are working</title></head>
<body style="margin:0;background:#f3f6fb;color:#111827;font-family:Inter,Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;"><tr><td align="center">
  <table role="presentation" width="100%" style="max-width:560px;background:#fff;border:1px solid #dbe4f0;border-radius:20px;overflow:hidden;">
    <tr><td style="padding:28px 34px;background:#00296B;color:#fff;font-size:24px;font-weight:800;">Code<span style="color:#FDC500;">Hive</span></td></tr>
    <tr><td style="padding:34px;"><h1 style="margin:0 0 14px;font-size:26px;">Email notifications are working</h1>
      <p style="color:#475569;line-height:1.65;" th:text="|Hi ${name}, CodeHive can deliver notifications to this address.|">Delivery confirmed.</p>
      <a th:href="${ctaUrl}" th:text="${ctaLabel}" style="display:inline-block;margin-top:10px;padding:13px 20px;border-radius:10px;background:#00509D;color:#fff;text-decoration:none;font-weight:700;">Open CodeHive</a>
    </td></tr>
  </table>
</td></tr></table>
</body></html>
