<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="notification(badge,title,summary,facts,callout,ctaLabel,ctaUrl,preferencesUrl,toneBackground,toneForeground,toneBorder)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">CodeHive notification</title>
</head>
<body style="margin:0;background:#f3f6fb;color:#111827;font-family:Inter,Arial,sans-serif;">
<div th:text="${summary}" style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">CodeHive update</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f6fb;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dbe4f0;border-radius:24px;overflow:hidden;box-shadow:0 16px 40px rgba(0,41,107,.12);">
      <tr><td style="padding:30px 36px;background:#00296B;background-image:linear-gradient(135deg,#00509D,#003F88,#00296B);">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr>
          <td style="font-size:24px;font-weight:800;color:#ffffff;">Code<span style="color:#FDC500;">Hive</span></td>
          <td align="right"><span th:text="${badge}" th:style="|display:inline-block;padding:7px 12px;border-radius:999px;background:${toneBackground};color:${toneForeground};border:1px solid ${toneBorder};font-size:11px;font-weight:800;letter-spacing:.08em;|">UPDATE</span></td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:36px;">
        <h1 th:text="${title}" style="margin:0 0 14px;font-size:28px;line-height:1.25;color:#111827;">Notification title</h1>
        <p th:text="${summary}" style="margin:0 0 26px;font-size:16px;line-height:1.7;color:#4b5563;">Notification summary</p>
        <table th:if="${!facts.isEmpty()}" role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px;border:1px solid #dbe4f0;border-radius:16px;border-collapse:separate;overflow:hidden;">
          <tr th:each="fact : ${facts}">
            <td th:text="${fact.label}" style="padding:10px 14px;border-bottom:1px solid #e5e7eb;color:#64748b;font-size:13px;font-weight:700;width:34%;">Label</td>
            <td th:text="${fact.value}" style="padding:10px 14px;border-bottom:1px solid #e5e7eb;color:#111827;font-size:14px;line-height:1.45;">Value</td>
          </tr>
        </table>
        <table th:if="${callout != null}" role="presentation" width="100%" cellspacing="0" cellpadding="0" th:style="|margin:0 0 24px;background:${toneBackground};border:1px solid ${toneBorder};border-radius:14px;|">
          <tr><td style="padding:17px 19px;">
            <div th:text="${callout.title}" th:style="|margin:0 0 6px;color:${toneForeground};font-size:13px;font-weight:800;|">Important</div>
            <div th:text="${callout.body}" style="white-space:pre-wrap;color:#334155;font-size:14px;line-height:1.55;">Callout</div>
          </td></tr>
        </table>
        <a th:href="${ctaUrl}" th:text="${ctaLabel}" style="display:inline-block;padding:14px 22px;border-radius:12px;background:#00509D;color:#ffffff;text-decoration:none;font-weight:700;">Open CodeHive</a>
        <p style="margin:16px 0 0;color:#64748b;font-size:12px;line-height:1.5;">Button not working? <a th:href="${ctaUrl}" th:text="${ctaUrl}" style="color:#00509D;word-break:break-all;">Open link</a></p>
      </td></tr>
      <tr><td style="padding:24px 36px;background:#f8fafc;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px;line-height:1.6;">
        You received this email because this notification is enabled for your CodeHive account.
        <a th:href="${preferencesUrl}" style="color:#00509D;">Manage notification preferences</a>.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
