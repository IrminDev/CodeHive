<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f3f6fb;font-family:Inter,Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;"><tr><td align="center">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:24px;overflow:hidden;border:1px solid #dbe4f0;">
    <tr><td style="padding:30px 36px;background:#00296B;background-image:linear-gradient(135deg,#00509D,#003F88,#00296B);color:#fff;">
      <div style="font-size:26px;font-weight:800;">Code<span style="color:#FDC500;">Hive</span></div>
    </td></tr>
    <tr><td style="padding:36px;">
      <span style="display:inline-block;padding:7px 12px;border-radius:999px;background:#FDC500;color:#00296B;font-size:11px;font-weight:800;">PASSWORD RESET</span>
      <h1 style="margin:20px 0 12px;font-size:28px;">Reset your password</h1>
      <p style="color:#4b5563;line-height:1.7;">A password reset was requested for your CodeHive account. The link expires in 15 minutes.</p>
      <a th:href="${resetUrl}" style="display:inline-block;padding:14px 22px;border-radius:12px;background:#00509D;color:#fff;text-decoration:none;font-weight:700;">Reset password</a>
      <p style="margin-top:24px;color:#6b7280;font-size:13px;line-height:1.6;">If you did not request this change, you can safely ignore this email.</p>
    </td></tr>
  </table>
</td></tr></table>
</body>
</html>
