spring.config.import=optional:file:.env[.properties]

spring.application.name=codehive

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codehive}
spring.datasource.username=${DATABASE_USERNAME:codehive}
spring.datasource.password=${DATABASE_PASSWORD:codehive}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT Configuration
# The secret must be a Base64-encoded key of at least 256 bits (32 bytes) for HS256
security.jwt.secret=${JWT_SECRET:Y29kZWhpdmVTZWNyZXRLZXlGb3JKd3RTaWduaW5nMjU2Qml0c09r}
security.jwt.expiration=${JWT_EXPIRATION:36000000}

# Java Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:codehive@codehive.com}
spring.mail.password=${MAIL_PASSWORD:codehive}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}