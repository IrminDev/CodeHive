spring.config.import=optional:file:.env[.properties]

spring.application.name=codehive

spring.datasource.url=${DATABASE_URL:dburlexample}
spring.datasource.username=${DATABASE_USERNAME:default}
spring.datasource.password=${DATABASE_PASSWORD:default}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT Configuration
# The secret must be a Base64-encoded key of at least 256 bits (32 bytes) for HS256
security.jwt.secret=${JWT_SECRET:defaultSecret}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Java Mail Configuration
spring.mail.host=${MAIL_HOST:defaultHost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:defaultUser}
spring.mail.password=${MAIL_PASSWORD:defaultPassword}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

# Frontend URL
frontend.url=${FRONTEND_URL:defaultFrontendUrl}

# Minio Configuration
minio.url=${MINIO_URL:defaultMinioUrl}
minio.accessKey=${MINIO_ACCESS_KEY:defaultAccessKey}
minio.secretKey=${MINIO_SECRET_KEY:defaultSecretKey}
minio.bucketName=${MINIO_BUCKET_NAME:defaultBucketName}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:defaultRabbitHost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:defaultRabbitUser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:defaultRabbitPassword}
spring.rabbitmq.queue=${RABBITMQ_QUEUE:defaultQueue}
spring.rabbitmq.result.queue=${RABBITMQ_RESULT_QUEUE:defaultResultQueue}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Email notifications
notification.email.max-attempts=${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
notification.reminder.fixed-delay-ms=${NOTIFICATION_REMINDER_FIXED_DELAY_MS:600000}
notification.reminder.initial-delay-ms=${NOTIFICATION_REMINDER_INITIAL_DELAY_MS:60000}
notification.default-timezone=America/Mexico_City
notification.default-locale=en-US

# Admin Initializer
app.admin.email=${ADMIN_EMAIL:admin@codehive.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:Super}
app.admin.lastName=${ADMIN_LAST_NAME:Admin}
app.admin.enrollmentNumber=${ADMIN_ENROLLMENT_NUMBER:ADMIN-001}
